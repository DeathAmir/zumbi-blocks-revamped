name: Native Engine CI
on:
  push:
    branches: [custom-engine-migration]
  pull_request:
    branches: [custom-engine-migration]
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Configure
        run: cmake -S NativeEngine -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test signed Zlib asset package
        run: ./build/zumbi_native asset-selftest
      - name: Test native engine core
        run: ./build/zumbi_native selftest
      - name: Test encrypted archive
        shell: bash
        run: |
          printf 'zumbi native archive smoke test' > input.bin
          KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          ./build/zumbi_native pack input.bin test.zpak "$KEY"
          ./build/zumbi_native unpack test.zpak output.bin "$KEY"
          cmp input.bin output.bin
          if ./build/zumbi_native unpack test.zpak rejected.bin 10112233445566778899aabbccddeeff00112233445566778899aabbccddeeff; then
            echo "Wrong key unexpectedly accepted"
            exit 1
          fi
      - name: Test Zumbi Scripts gameplay modules
        shell: bash
        run: |
          declare -A expected=(
            [gameplay]="Zumbi Scripts VM gameplay logic OK"
            [player_stats]="PlayerStats port tests OK"
            [enemy_combat]="Enemy combat port tests OK"
            [player_movement]="PlayerMovement port tests OK"
            [wave_director]="WaveDirector port tests OK"
            [collections]="ZS collections and state tests OK"
          )
          for name in "${!expected[@]}"; do
            ./build/zumbi_native compile "NativeEngine/tests/$name.zs" "$name.zsc"
            output=$(./build/zumbi_native run "$name.zsc")
            grep -F "${expected[$name]}" <<< "$output"
            if [[ "$name" == "collections" ]]; then
              grep -F "ZS collection mutation tests OK" <<< "$output"
            fi
          done
