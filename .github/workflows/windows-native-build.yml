name: Windows Native Engine Build
on:
  push:
    branches: [custom-engine-migration]
  pull_request:
    branches: [custom-engine-migration]
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      ZBR_ASSET_SIGNING_PRIVATE_KEY: \${{ secrets.ZBR_ASSET_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download precompiled OpenSSL and zlib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build/prebuilt | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/openssl-native/3.5.9" -OutFile build/prebuilt/openssl-native.nupkg -MaximumRedirection 10 -TimeoutSec 240
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/zlib-windows-x64/1.3.1.1000" -OutFile build/prebuilt/zlib-windows-x64.nupkg -MaximumRedirection 10 -TimeoutSec 180
          Expand-Archive build/prebuilt/openssl-native.nupkg build/prebuilt/openssl -Force
          Expand-Archive build/prebuilt/zlib-windows-x64.nupkg build/prebuilt/zlib -Force
          $opensslHeader = Get-ChildItem build/prebuilt/openssl -Recurse -File -Filter evp.h | Where-Object { $_.FullName -match '[\\/]include[\\/]openssl[\\/]evp.h
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native engine build failed" }
          New-Item -ItemType Directory -Force build/Release | Out-Null
          Get-ChildItem $env:OPENSSL_DLL_DIR -Filter *.dll | Copy-Item -Destination build/Release -Force
          Get-ChildItem $env:ZLIB_ROOT -Recurse -File -Filter *.dll | Copy-Item -Destination build/Release -Force
      - name: Compile connected player and UI systems
        shell: pwsh
        run: |
          .\build\Release\zumbi_native.exe compile NativeEngine/scripts/player_system.zs NativeEngine/scripts/player_system.zsc
          if ($LASTEXITCODE -ne 0) { throw "Player system ZS compile failed" }
          .\build\Release\zumbi_native.exe game-selftest
          if ($LASTEXITCODE -ne 0) { throw "Connected player and UI runtime tests failed" }
          .\build\Release\zumbi_native.exe game-loop NativeEngine/scripts/player_system.zsc 10
          if ($LASTEXITCODE -ne 0) { throw "Persistent ten-frame ZS runtime test failed" }
      - name: Test signed Zlib asset package
        shell: pwsh
        run: |
          .\build\Release\zumbi_native.exe asset-selftest
          if ($LASTEXITCODE -ne 0) { throw "Asset package self-test failed" }
      - name: Test native engine core
        shell: pwsh
        run: |
          .\build\Release\zumbi_native.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "Native engine core self-test failed" }
      - name: Test encrypted archive
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Content -NoNewline -Encoding ascii input.bin "zumbi native archive smoke test"
          $key = "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
          .\build\Release\zumbi_native.exe pack input.bin test.zbp $key
          if ($LASTEXITCODE -ne 0) { throw "Pack failed" }
          .\build\Release\zumbi_native.exe unpack test.zbp output.bin $key
          if ($LASTEXITCODE -ne 0) { throw "Unpack failed" }
          if ((Get-FileHash input.bin).Hash -ne (Get-FileHash output.bin).Hash) { throw "Round-trip mismatch" }
          $wrongKey = "10112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
          .\build\Release\zumbi_native.exe unpack test.zbp rejected.bin $wrongKey
          if ($LASTEXITCODE -eq 0) { throw "Wrong key was accepted" }
          Write-Output "Wrong key correctly rejected"
          exit 0
      - name: Test Zumbi Scripts compiler, VM and gameplay ports
        shell: pwsh
        run: |
          $tests = @(
            @{ File = "gameplay"; Expected = "Zumbi Scripts VM gameplay logic OK" },
            @{ File = "player_stats"; Expected = "PlayerStats port tests OK" },
            @{ File = "enemy_combat"; Expected = "Enemy combat port tests OK" },
            @{ File = "player_movement"; Expected = "PlayerMovement port tests OK" },
            @{ File = "wave_director"; Expected = "WaveDirector port tests OK" },
            @{ File = "collections"; Expected = "ZS collections and state tests OK" }
          )
          foreach ($test in $tests) {
            $source = "NativeEngine/tests/$($test.File).zs"
            $bytecode = "$($test.File).zsc"
            .\build\Release\zumbi_native.exe compile $source $bytecode
            if ($LASTEXITCODE -ne 0) { throw "ZS compilation failed: $source" }
            $output = & .\build\Release\zumbi_native.exe run $bytecode 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "ZSC VM execution failed: $source; output: $output" }
            if ($output -notmatch [regex]::Escape($test.Expected)) { throw "Gameplay result mismatch: $source; output: $output" }
            if ($test.File -eq "collections" -and $output -notmatch "ZS collection mutation tests OK") { throw "Collection mutation tests failed: $output" }
            Write-Output "$($test.File): passed"
          }
          .\build\Release\zumbi_native.exe disasm gameplay.zsc gameplay.zsa
          if ($LASTEXITCODE -ne 0) { throw "ZSA disassembly failed" }
          $listing = Get-Content gameplay.zsa -Raw
          if ($listing -notmatch '\.function\s+[a-z0-9]{3}') { throw "Randomized assembly symbols missing" }
      - name: Build and verify signed game content
        if: env.ZBR_ASSET_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $publicKey = (& .\build\Release\zumbi_native.exe asset-public-key-env | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $publicKey -notmatch '^[0-9a-f]{64}$') { throw "Could not derive asset public key" }
          Set-Content -NoNewline -Encoding ascii NativeEngine/keys/asset_signing_public_key.hex $publicKey
          cmake -S NativeEngine -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR" -DOPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_CRYPTO_LIBRARY" -DZLIB_INCLUDE_DIR="$env:ZLIB_INCLUDE_DIR" -DZLIB_LIBRARY_RELEASE="$env:ZLIB_LIBRARY_RELEASE" -DZLIB_LIBRARY="$env:ZLIB_LIBRARY_RELEASE"
          if ($LASTEXITCODE -ne 0) { throw "Reconfigure with pinned public key failed" }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Rebuild with pinned public key failed" }
          .\build\Release\zumbi_native.exe compile NativeEngine/scripts/player_system.zs NativeEngine/scripts/player_system.zsc
          if ($LASTEXITCODE -ne 0) { throw "Player system compile failed" }
          New-Item -ItemType Directory -Force build/PackageSource/Assets | Out-Null
          New-Item -ItemType Directory -Force build/PackageSource/Scripts | Out-Null
          Copy-Item -Path Assets\* -Destination build/PackageSource/Assets -Recurse -Force
          Copy-Item NativeEngine/scripts/player_system.zsc build/PackageSource/Scripts/player_system.zsc
          .\build\Release\zumbi_native.exe asset-pack build/PackageSource build/GamePackage
          if ($LASTEXITCODE -ne 0) { throw "Asset packing failed" }
          Copy-Item NativeEngine/scripts/player_system.zsc build/GamePackage/Game/ZBR/Scripts/player_system.zsc
          Copy-Item build/Release/zumbi_native.exe build/GamePackage/Game/Bin/zumbi_native.exe
          Get-ChildItem build/Release -Filter *.dll | Copy-Item -Destination build/GamePackage/Game/Bin -Force
          .\build\Release\zumbi_native.exe asset-verify build/GamePackage
          if ($LASTEXITCODE -ne 0) { throw "Signed asset verification failed" }
          Push-Location build/GamePackage
          cmake -E tar cf "../ZBR Engine.zbp" --format=zip Game
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "ZBR Engine.zbp archive creation failed" }
          Pop-Location
      - name: Upload Windows executable and game package
        uses: actions/upload-artifact@v4
        with:
          name: zumbi-native-windows-x64
          path: |
            build/Release/zumbi_native.exe
            build/Release/*.dll
            build/ZBR Engine.zbp
            build/GamePackage/Game/**
          if-no-files-found: warn
 } | Select-Object -First 1
          $opensslLibrary = Get-ChildItem build/prebuilt/openssl -Recurse -File -Filter libcrypto.lib | Where-Object { $_.FullName -match '[\\/]lib[\\/]win-x64[\\/]native[\\/]' } | Select-Object -First 1
          $zlibHeader = Get-ChildItem build/prebuilt/zlib -Recurse -File -Filter zlib.h | Select-Object -First 1
          $zlibLibrary = Get-ChildItem build/prebuilt/zlib -Recurse -File -Filter *.lib | Where-Object { $_.Name -match 'zlib' } | Select-Object -First 1
          if (!$opensslHeader -or !$opensslLibrary -or !$zlibHeader -or !$zlibLibrary) { throw "Precompiled native headers or libraries were not found in the pinned NuGet packages" }
          $opensslDllDir = Join-Path (Get-Location) "build/prebuilt/openssl/runtimes/win-x64/native"
          if (!(Test-Path $opensslDllDir)) { throw "OpenSSL x64 runtime DLL directory is missing" }
          "OPENSSL_INCLUDE_DIR=$($opensslHeader.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_CRYPTO_LIBRARY=$($opensslLibrary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_DLL_DIR=$opensslDllDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZLIB_INCLUDE_DIR=$($zlibHeader.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZLIB_LIBRARY_RELEASE=$($zlibLibrary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZLIB_ROOT=$((Get-Item build/prebuilt/zlib).FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        shell: pwsh
        run: |
          cmake -S NativeEngine -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR" -DOPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_CRYPTO_LIBRARY" -DZLIB_INCLUDE_DIR="$env:ZLIB_INCLUDE_DIR" -DZLIB_LIBRARY_RELEASE="$env:ZLIB_LIBRARY_RELEASE" -DZLIB_LIBRARY="$env:ZLIB_LIBRARY_RELEASE"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
