name: Windows Native Engine Build
on:
  push:
    branches: [custom-engine-migration]
  pull_request:
    branches: [custom-engine-migration]
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S NativeEngine -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test native engine core
        run: |
          .\build\Release\zumbi_native.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "Native engine core self-test failed" }
      - name: Test encrypted archive
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Content -NoNewline -Encoding ascii input.bin "zumbi native archive smoke test"
          $key = "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
          .\build\Release\zumbi_native.exe pack input.bin test.zbp $key
          if ($LASTEXITCODE -ne 0) { throw "Pack failed" }
          .\build\Release\zumbi_native.exe unpack test.zbp output.bin $key
          if ($LASTEXITCODE -ne 0) { throw "Unpack failed" }
          if ((Get-FileHash input.bin).Hash -ne (Get-FileHash output.bin).Hash) { throw "Round-trip mismatch" }
          $wrongKey = "10112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
          .\build\Release\zumbi_native.exe unpack test.zbp rejected.bin $wrongKey
          if ($LASTEXITCODE -eq 0) { throw "Wrong key was accepted" }
          Write-Output "Wrong key correctly rejected"
          exit 0
      - name: Test Zumbi Scripts compiler, VM and gameplay ports
        shell: pwsh
        run: |
          $tests = @(
            @{ File = "gameplay"; Expected = "Zumbi Scripts VM gameplay logic OK" },
            @{ File = "player_stats"; Expected = "PlayerStats port tests OK" },
            @{ File = "enemy_combat"; Expected = "Enemy combat port tests OK" },
            @{ File = "player_movement"; Expected = "PlayerMovement port tests OK" },
            @{ File = "wave_director"; Expected = "WaveDirector port tests OK" },
            @{ File = "collections"; Expected = "ZS collections and state tests OK" }
          )
          foreach ($test in $tests) {
            $source = "NativeEngine/tests/$($test.File).zs"
            $bytecode = "$($test.File).zsc"
            .\build\Release\zumbi_native.exe compile $source $bytecode
            if ($LASTEXITCODE -ne 0) { throw "ZS compilation failed: $source" }
            $output = & .\build\Release\zumbi_native.exe run $bytecode 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "ZSC VM execution failed: $source; output: $output" }
            if ($output -notmatch [regex]::Escape($test.Expected)) { throw "Gameplay result mismatch: $source; output: $output" }
            if ($test.File -eq "collections" -and $output -notmatch "ZS collection mutation tests OK") { throw "Collection mutation tests failed: $output" }
            Write-Output "$($test.File): passed"
          }
          .\build\Release\zumbi_native.exe disasm gameplay.zsc gameplay.zsa
          if ($LASTEXITCODE -ne 0) { throw "ZSA disassembly failed" }
          $listing = Get-Content gameplay.zsa -Raw
          if ($listing -notmatch '\.function\s+[a-z0-9]{3}') { throw "Randomized assembly symbols missing" }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: zumbi-native-windows-x64
          path: build/Release/zumbi_native.exe
          if-no-files-found: error
